# R environment for DECLTR and WGCNA.
# Create with: mamba env create -f DECLTR_env.yml && mamba activate DECLTR-env
name: DECLTR-env
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.2
  - r-data.table
  - r-yaml
  - r-qs
  - r-segmented
  - r-testthat
  - r-matrixstats
  - r-dplyr
  - r-tidyr
  - r-readr
  - r-stringr
  - bioconductor-wgcna
  - bioconductor-deseq2
  - ca-certificates
  - openssl
